receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

extensions:
  basicauth/otlp:
    client_auth:
      username: ${env:GRAFANA_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_TOKEN}

exporters:
  debug:
    verbosity: detailed

  otlphttp:
    endpoint: https://otlp-gateway-prod-ap-southeast-1.grafana.net/otlp
    auth:
      authenticator: basicauth/otlp

service:
  extensions: [basicauth/otlp]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp]
