  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    env_file: .env  # inject GRAFANA_CLOUD_TOKEN, GRAFANA_INSTANCE_ID
    volumes:
      - ./src/scyes/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
